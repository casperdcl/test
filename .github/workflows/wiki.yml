name: Post Release
on:
  release:
    types: [published]
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        repository: ${{ github.repository }}.wiki
    - name: Update Releases
      run: |
        make
        git config user.email "$GIT_AUTHOR_EMAIL"
        git config user.name "$GIT_AUTHOR_NAME"
        git commit -a -m "update release notes to ${GITHUB_REF#refs/tags/}"
        git push
      env:
        GIT_AUTHOR_NAME: ${{ github.event.sender.login }}
        GIT_AUTHOR_EMAIL: ${{ github.event.sender.login }}@users.noreply.github.com

name: Post Release
on:
  release:
    types: [published]
#  push:
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        repository: ${{ github.repository }}.wiki
        # token: ${{ github.token }}
        path: wiki
    - name: Update Releases
      run: |
        make
        head -c32 /dev/urandom > foo.md && git add foo.md
        git config --global user.email "casperdcl@noreply.github.com"
        git config --global user.name "wiki-bot"
        git commit -am "update release notes to ${GITHUB_REF#refs/tags/}"
        git push
        #git clone https://${}@github.com/tqdm/tqdm.wiki
#      env:
#        BODY: ${{ github.event.comment.body }}
#        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    - name: Update Releases
      id: get_version
      run: echo ::set-env name=RELEASE_VERSION::$(echo ${GITHUB_REF:10})
    - name: Publish to Registry
      uses: elgohr/Publish-Docker-Github-Action@master
      with:
        name: myDocker/repository
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        tags: "latest,${{ env.RELEASE_VERSION }}"
